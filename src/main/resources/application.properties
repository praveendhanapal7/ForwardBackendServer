spring.application.name=ForwardBackend
server.port=8080

# Use dev, prod, or test (e.g. SPRING_PROFILES_ACTIVE=prod on Railway)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Auth session ---
# Lifetime of issued bearer tokens, in hours (default: 7 days)
app.auth.session-ttl-hours=${APP_AUTH_SESSION_TTL_HOURS:168}

# Comma-separated browser origins. Override in deployment with env APP_CORS_ALLOWED_ORIGINS (or set this key only—avoid : in default placeholders).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://forwardagency.in,https://www.forwardagency.in

# --- Datasource: set in environment (e.g. Railway) — never commit real credentials ---
# Example variable names: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# --- JPA (overridden in profile-specific files) ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.initializationFailTimeout=60000
